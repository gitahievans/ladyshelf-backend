server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name registry.ladyshelf.site;
    server_tokens off;

    ssl_certificate /etc/ssl/certs/registry.ladyshelf.site.pem;
    ssl_certificate_key /etc/ssl/private/registry.ladyshelf.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/registry.ladyshelf.site.access.log;
    error_log /var/log/nginx/registry.ladyshelf.site.error.log warn;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
