<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ brand_name }}</title>
  </head>
  <body style="margin:0; padding:0; background:#FAF6F0; color:#1A1009; font-family:'DM Sans', Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#FAF6F0; margin:0; padding:0;">
      <tr>
        <td align="center" style="padding:28px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px; overflow:hidden; border:1px solid #E0D5C5; background:#F2EAD8;">
            <tr>
              <td style="background:#1A1009; padding:30px 28px; text-align:center;">
                <img src="{{ logo_url }}" alt="{{ brand_name }}" width="190" style="display:inline-block; max-width:190px; height:auto;">
                <p style="margin:14px 0 0; color:#D4A853; font-size:12px; line-height:1.5; letter-spacing:0.18em; text-transform:uppercase;">
                  {{ brand_tagline }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 28px 28px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="background:#1A1009; padding:26px 28px; text-align:center;">
                <p style="margin:0; color:#FAF6F0; font-size:14px; line-height:1.7;">{{ store_location }}</p>
                <p style="margin:6px 0 0; color:#9C7E5F; font-size:13px; line-height:1.6;">{{ store_hours }}</p>
                <p style="margin:16px 0 0; color:#D4A853; font-size:12px; line-height:1.5; letter-spacing:0.12em; text-transform:uppercase;">
                  {{ website_url }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
